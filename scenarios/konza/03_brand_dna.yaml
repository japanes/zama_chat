# Konza test tenant — Brand DNA = the «ДНК Бизнеса» document.
# Source: the «ДНК проекта» section («ДНК Бизнеса: подготовка контекста») of the workshop page
# factory/tmp/kovcheg/index.html. The owner's decision of 2026-10-08: that section is the brand
# DNA.
#
# One step = one question (the owner's decision of 2026-10-09). Before that a block was one
# step and its question held several questions at once («Почему именно это? Что вас
# мотивирует? Экспертиза, страсть, деньги?»); that version is kept in
# tmp/konza/scenarios-before-2026-10-09/.
# The 7 blocks are the blocks of the section's «план максимум» prompt, in its order. Every
# part a block names there («кто я, экспертиза, история, мотивация») is one step, and so is
# every separate question of the section's «5 вопросов» that belongs to the block. Where the
# source has the question in words, the step keeps them («Какой ваш личный опыт в этой теме?»,
# «Кто ваш идеальный клиент?», «Сколько времени можете выделить?»); a part the source only
# names gets a plain question about it.
# Field keys are «<block>_<part>». The part before the first «_» is the item key of the
# factory kind `brand_business` (factory/api/services/dna/definitions_v2.json: founder,
# product, audience, market, goals, resources, limits): the answers of a block are collected
# into that item.
# The source talks to the person as «ты». Here the same words stand in «вы»: the bot words
# every question anew, and a «ты» hint leaked into its replies next to its usual «ви» (run of
# 2026-10-08).
# Filters follow the source's «задавай уточняющие вопросы, пока не получишь достаточно
# деталей»: a filter only tells a concrete answer from general words, and only the steps
# where general words are a real risk have one. «не знаю» / «нет» pass where a person may
# honestly not know or have nothing: nothing is made up for them.
# Descriptions must not tell the model to repeat what the client said earlier: the engine adds
# a new reply to an incomplete answer itself (fields.merge_value) and drops an extracted value
# made of less than 60% of the current message's words (extract.grounded).
# A description is also the hint the reply model gets with the question (plan._ask_step): what
# it names shows up in the bot's phrase. So a description names ONE thing and has no example
# from a particular business — a «например …» about a dog trainer was asked back to the client
# as a second question (run of 2026-10-09). For the same reason a filter's `ask` names one
# thing: the clarifying question is worded from it (plan: ClarifyStep.missing); the details of
# what passes stand in the filter's «yes» / «no» texts, which only the decision model reads.
# `answers: asked` — an answer is written only to the question the bot asked last. Without it
# the engine checked every message against all 27 questions, and close questions took each
# other's words: «Беру только щенков до восьми месяцев» said about the product's uniqueness
# was saved as the ideal client, and the uniqueness stayed empty; «хочу уйти в онлайн» from
# the motivation answer was saved as «онлайн или оффлайн» (runs of 2026-10-09). Sentences in
# descriptions that tried to guard against this did not help and are removed.
# Titles, questions and the confirm question have uk / en texts next to ru: the first
# question and the question after a skip are sent as written here, without a model call
# (POST /v1/runs/start, /skip), so they must exist in the language of the interface. ru is
# the source wording; uk / en are translations of it (2026-10-09), not the owner's words.
# TODO(review): all wording (questions, filters, start signs) — check on live dialogues.
key: brand_dna
title:
  ru: ДНК бренда
  uk: "ДНК бренду"
  en: "Brand DNA"
language: ru
description: >-
  Собираем документ «ДНК Бизнеса», который даст нейросетям понимание проекта клиента. Семь
  блоков: основатель, продукт, аудитория, рынок, цели, ресурсы, ограничения. По одному
  вопросу за раз, с уточняющим вопросом, если в ответе только общие слова.

start:
  questions:
    - key: wants_brand_dna
      ask: >-
        Клиент в этом сообщении прямо просит собрать ДНК бренда или «ДНК Бизнеса» — документ о
        нём самом и его деле? Если он просит только про ДНК продукта или исследование рынка,
        либо просто рассказывает о себе и отвечает на вопрос бота — ответ «нет».
      weight: 4
  threshold: 4            # above the product scenarios (3 at most): «product and brand» in one
                          # message starts the brand first — the research prompts of a product
                          # are written from the brand DNA

fields:
  # --- Блок 1. Основатель: кто я, экспертиза, история, мотивация ---------------------------
  - key: founder_who
    type: text
    title:
      ru: "Основатель: кто вы"
      uk: "Засновник: хто ви"
      en: "Founder: who you are"
    question:
      ru: Кто вы и чем занимаетесь?
      uk: "Хто ви і чим займаєтеся?"
      en: "Who are you and what do you do?"
    description: >-
      Профессия или дело человека его словами. Только то, что человек сам говорит о себе.
    filters:
      - key: concrete_who
        ask: Клиент назвал свою профессию или дело?
        "no": Нет — только общие слова («эксперт», «специалист», «предприниматель», «давно в теме») без того, чем именно он занимается.

  - key: founder_expertise
    type: text
    title:
      ru: "Основатель: опыт"
      uk: "Засновник: досвід"
      en: "Founder: experience"
    question:
      ru: Какой ваш личный опыт в этой теме?
      uk: "Який ваш особистий досвід у цій темі?"
      en: "What is your personal experience in this field?"
    description: >-
      Личный опыт человека в его теме. Если опыта в теме пока нет — так и записывается.
    filters:
      - key: concrete_expertise
        ask: Клиент назвал что-то конкретное о своём опыте?
        "yes": Да — назван срок, дело, учёба или результат. Также «да», если клиент прямо сказал, что опыта в теме у него пока нет.
        "no": Нет — только общие слова («опыт большой», «давно в теме», «я эксперт») без срока, дел, учёбы или результатов.

  - key: founder_story
    type: text
    title:
      ru: "Основатель: история"
      uk: "Засновник: історія"
      en: "Founder: story"
    question:
      ru: Как вы пришли к этому делу?
      uk: "Як ви прийшли до цієї справи?"
      en: "How did you come to this work?"
    description: >-
      История человека: как он оказался в своём деле.

  - key: founder_motivation
    type: text
    title:
      ru: "Основатель: мотивация"
      uk: "Засновник: мотивація"
      en: "Founder: motivation"
    question:
      ru: Что вас мотивирует заниматься именно этим?
      uk: "Що вас мотивує займатися саме цим?"
      en: "What motivates you to do exactly this?"
    description: >-
      Мотивация человека: что им движет — экспертиза, страсть, деньги или другое.

  # --- Блок 2. Продукт: что продаю, формат, уникальность, стадия ---------------------------
  - key: product_what
    type: text
    title:
      ru: "Продукт: что продаёте"
      uk: "Продукт: що продаєте"
      en: "Product: what you sell"
    question:
      ru: Что вы хотите продавать?
      uk: "Що ви хочете продавати?"
      en: "What do you want to sell?"
    description: >-
      Продукт или услуга, которую человек продаёт или хочет продавать, его словами. Если
      человек не знает точно — два-три варианта тоже ответ.
    filters:
      - key: concrete_product
        ask: Клиент назвал, что именно у него можно купить?
        "yes": Да — назван продукт или услуга. Также «да», если клиент описал два-три варианта и ещё не выбрал.
        "no": Нет — названо только занятие или сфера («занимаюсь маркетингом», «психология», «помогаю людям») или непонятно, за что платят.

  - key: product_format
    type: text
    title:
      ru: "Продукт: формат"
      uk: "Продукт: формат"
      en: "Product: format"
    question:
      ru: В каком формате вы продаёте свой продукт?
      uk: "У якому форматі ви продаєте свій продукт?"
      en: "In what format do you sell your product?"
    description: >-
      Формат продукта: в каком виде клиент его получает. Если формат ещё не выбран — так и
      записывается.

  - key: product_unique
    type: text
    title:
      ru: "Продукт: уникальность"
      uk: "Продукт: унікальність"
      en: "Product: uniqueness"
    question:
      ru: В чём уникальность вашего продукта?
      uk: "У чому унікальність вашого продукту?"
      en: "What makes your product unique?"
    description: >-
      Уникальность: чем продукт отличается от похожих у других. Если человек не знает или
      считает, что отличий нет, — так и записывается.
    filters:
      - key: concrete_unique
        ask: Клиент назвал хотя бы одно конкретное отличие своего продукта от похожих?
        "yes": Да — отличие названо. Также «да», если клиент прямо сказал, что не знает или что отличий нет.
        "no": Нет — только общие слова («качество», «индивидуальный подход», «лучше других») без того, в чём именно отличие.

  - key: product_stage
    type: text
    title:
      ru: "Продукт: стадия"
      uk: "Продукт: стадія"
      en: "Product: stage"
    question:
      ru: На какой стадии ваш продукт — это пока идея или уже есть продажи?
      uk: "На якій стадії ваш продукт — це поки ідея чи вже є продажі?"
      en: "What stage is your product at — still an idea, or are there sales already?"
    description: >-
      Стадия продукта: только идея, первые клиенты или давно продаётся.

  # --- Блок 3. Аудитория: кому продаю, сегменты, текущие клиенты ---------------------------
  - key: audience_ideal
    type: text
    title:
      ru: "Аудитория: идеальный клиент"
      uk: "Аудиторія: ідеальний клієнт"
      en: "Audience: ideal client"
    question:
      ru: Кто ваш идеальный клиент?
      uk: "Хто ваш ідеальний клієнт?"
      en: "Who is your ideal client?"
    description: >-
      Идеальный клиент человека — тот, кому он хочет продавать. Если человек пока не знает,
      кто его идеальный клиент, — так и записывается.
    filters:
      - key: concrete_audience
        ask: Клиент описал своего идеального клиента конкретными признаками?
        "yes": Да — названы признаки — возраст, пол, доход, привычки, профессия или ситуация. Также «да», если клиент прямо сказал, что пока не знает, кто его идеальный клиент.
        "no": Нет — «все», «кому нужно», «всем, кому это интересно» — без признаков, по которым такого человека можно отличить.

  - key: audience_segments
    type: text
    title:
      ru: "Аудитория: сегменты"
      uk: "Аудиторія: сегменти"
      en: "Audience: segments"
    question:
      ru: На какие группы делятся ваши клиенты?
      uk: "На які групи поділяються ваші клієнти?"
      en: "What groups do your clients fall into?"
    description: >-
      Сегменты: на какие разные группы делятся клиенты человека. Если группа одна или человек
      не знает — так и записывается.

  - key: audience_current
    type: text
    title:
      ru: "Аудитория: текущие клиенты"
      uk: "Аудиторія: поточні клієнти"
      en: "Audience: current clients"
    question:
      ru: Кто покупает у вас сейчас?
      uk: "Хто купує у вас зараз?"
      en: "Who buys from you now?"
    description: >-
      Текущие клиенты: кто покупает у человека уже сейчас. Если клиентов пока нет — так и
      записывается.

  - key: audience_not
    type: text
    title:
      ru: "Аудитория: не ваш клиент"
      uk: "Аудиторія: не ваш клієнт"
      en: "Audience: not your client"
    question:
      ru: Кого вы НЕ хотите видеть клиентом?
      uk: "Кого ви НЕ хочете бачити клієнтом?"
      en: "Who do you NOT want as a client?"
    description: >-
      Кого человек не хочет видеть своим клиентом. Если таких нет — так и записывается.

  # --- Блок 4. Рынок: география, конкуренция, ценовой сегмент -------------------------------
  - key: market_geo
    type: text
    title:
      ru: "Рынок: география"
      uk: "Ринок: географія"
      en: "Market: geography"
    question:
      ru: Где географически вы продаёте?
      uk: "Де географічно ви продаєте?"
      en: "Where, geographically, do you sell?"
    description: >-
      География: страна, регион или город, где человек продаёт или хочет продавать.
    filters:
      - key: concrete_geo
        ask: Клиент назвал страну, регион или город, где он продаёт?
        "yes": Да — место названо. Также «да», если клиент прямо сказал, что продаёт по всему миру, без привязки к стране.
        "no": Нет — место не названо — только «онлайн» или «в интернете» без страны, региона или города.

  - key: market_language
    type: text
    title:
      ru: "Рынок: язык аудитории"
      uk: "Ринок: мова аудиторії"
      en: "Market: audience language"
    question:
      ru: На каком языке говорит ваша аудитория?
      uk: "Якою мовою говорить ваша аудиторія?"
      en: "What language does your audience speak?"
    description: >-
      Язык или языки, на которых говорит аудитория человека.

  - key: market_channel
    type: text
    title:
      ru: "Рынок: онлайн или оффлайн"
      uk: "Ринок: онлайн чи офлайн"
      en: "Market: online or offline"
    question:
      ru: Вы работаете онлайн или оффлайн?
      uk: "Ви працюєте онлайн чи офлайн?"
      en: "Do you work online or offline?"
    description: >-
      Как человек работает с клиентами сейчас: онлайн, оффлайн или и так и так.

  - key: market_geo_limits
    type: text
    title:
      ru: "Рынок: ограничения по географии"
      uk: "Ринок: обмеження за географією"
      en: "Market: geographic limits"
    question:
      ru: Есть ли у вас ограничения по географии?
      uk: "Чи є у вас обмеження за географією?"
      en: "Do you have any geographic limits?"
    description: >-
      Ограничения по месту: где человек не может или не хочет работать. Если ограничений
      нет — так и записывается.

  - key: market_competition
    type: text
    title:
      ru: "Рынок: конкуренция"
      uk: "Ринок: конкуренція"
      en: "Market: competition"
    question:
      ru: Кто ваши конкуренты?
      uk: "Хто ваші конкуренти?"
      en: "Who are your competitors?"
    description: >-
      Конкуренция: кто ещё продаёт похожее тем же людям. Если человек не знает своих
      конкурентов или их нет — так и записывается.
    filters:
      - key: concrete_competition
        ask: Клиент назвал своих конкурентов?
        "yes": Да — названы имена, тип конкурентов или их число. Также «да», если клиент прямо сказал, что не знает их или что конкурентов нет.
        "no": Нет — только общие слова («конкурентов много», «рынок большой») без того, кто они и сколько их.

  - key: market_price
    type: text
    title:
      ru: "Рынок: ценовой сегмент"
      uk: "Ринок: ціновий сегмент"
      en: "Market: price segment"
    question:
      ru: В каком ценовом сегменте вы работаете — дёшево, средне или дорого?
      uk: "У якому ціновому сегменті ви працюєте — дешево, середньо чи дорого?"
      en: "What price segment do you work in — low, mid or high?"
    description: >-
      Ценовой сегмент: дёшево, средне или дорого по сравнению с другими. Названная цена тоже
      ответ. Если цены пока нет — так и записывается.

  # --- Блок 5. Цели: финансовые, временные, масштаб -----------------------------------------
  - key: goals_income
    type: text
    title:
      ru: "Цели: доход"
      uk: "Цілі: дохід"
      en: "Goals: income"
    question:
      ru: Сколько вы хотите зарабатывать в месяц?
      uk: "Скільки ви хочете заробляти на місяць?"
      en: "How much do you want to earn per month?"
    description: >-
      Финансовая цель: целевой доход в месяц. Если человек ещё не знает — так и записывается.
    filters:
      - key: concrete_income
        ask: Клиент назвал сумму или диапазон дохода, который хочет получать?
        "yes": Да — названа сумма или диапазон. Также «да», если клиент прямо сказал, что ещё не знает.
        "no": Нет — только общие слова («хочу больше зарабатывать», «чтобы хватало») без суммы.

  - key: goals_term
    type: text
    title:
      ru: "Цели: срок"
      uk: "Цілі: термін"
      en: "Goals: deadline"
    question:
      ru: К какому сроку вы хотите прийти к своей цели?
      uk: "До якого терміну ви хочете прийти до своєї мети?"
      en: "By when do you want to reach your goal?"
    description: >-
      Временная цель: к какому сроку человек хочет выйти на свой целевой доход. Если срока
      нет или человек не знает — так и записывается.

  - key: goals_scale
    type: text
    title:
      ru: "Цели: масштаб"
      uk: "Цілі: масштаб"
      en: "Goals: scale"
    question:
      ru: До какого масштаба вы хотите вырасти?
      uk: "До якого масштабу ви хочете вирости?"
      en: "What scale do you want to grow to?"
    description: >-
      Цель по масштабу: до какого размера человек хочет вырасти. Если расти он не планирует
      или не знает — так и записывается.

  # --- Блок 6. Ресурсы: бюджет, команда, время, навыки ---------------------------------------
  - key: resources_budget
    type: text
    title:
      ru: "Ресурсы: бюджет"
      uk: "Ресурси: бюджет"
      en: "Resources: budget"
    question:
      ru: Готовы ли вы инвестировать на старте?
      uk: "Чи готові ви інвестувати на старті?"
      en: "Are you ready to invest at the start?"
    description: >-
      Бюджет: сколько денег человек готов вложить на старте. Если вкладывать он не готов —
      так и записывается.
    filters:
      - key: concrete_budget
        ask: Клиент назвал сумму, которую готов вложить на старте?
        "yes": Да — сумма названа. Также «да», если клиент прямо сказал, что вкладывать не готов или что денег на это нет.
        "no": Нет — «да», «готов», «немного» — без суммы.

  - key: resources_team
    type: text
    title:
      ru: "Ресурсы: команда"
      uk: "Ресурси: команда"
      en: "Resources: team"
    question:
      ru: Кто работает вместе с вами?
      uk: "Хто працює разом із вами?"
      en: "Who works with you?"
    description: >-
      Команда: кто помогает человеку сейчас. Если он работает один — так и записывается.

  - key: resources_time
    type: text
    title:
      ru: "Ресурсы: время"
      uk: "Ресурси: час"
      en: "Resources: time"
    question:
      ru: Сколько времени вы можете выделить?
      uk: "Скільки часу ви можете виділити?"
      en: "How much time can you set aside?"
    description: >-
      Время: сколько часов в день или в неделю человек может уделять своему делу.
    filters:
      - key: concrete_time
        ask: Клиент назвал, сколько часов или дней он может выделить?
        "no": Нет — «мало», «немного», «сколько нужно» — без часов или дней.

  - key: resources_skills
    type: text
    title:
      ru: "Ресурсы: навыки"
      uk: "Ресурси: навички"
      en: "Resources: skills"
    question:
      ru: Что вы умеете делать сами?
      uk: "Що ви вмієте робити самі?"
      en: "What can you do yourself?"
    description: >-
      Навыки: что человек умеет делать сам для своего дела, кроме основной работы. Если
      таких навыков нет — так и записывается.

  # --- Блок 7. Ограничения: что точно не хочу, красные линии ---------------------------------
  - key: limits_not_want
    type: text
    title:
      ru: "Ограничения: чего не хотите"
      uk: "Обмеження: чого не хочете"
      en: "Limits: what you do not want"
    question:
      ru: Что вы точно не хотите делать?
      uk: "Що ви точно не хочете робити?"
      en: "What do you definitely not want to do?"
    description: >-
      Что человек точно не хочет делать в своём деле. Если таких вещей нет или человек об этом
      не думал — так и записывается.
    filters:
      - key: concrete_limit
        ask: Клиент назвал хотя бы одну конкретную вещь, которую он точно не хочет делать?
        "yes": Да — такая вещь названа. Также «да», если клиент прямо сказал, что таких вещей нет или что он об этом не думал.

  - key: limits_red_lines
    type: text
    title:
      ru: "Ограничения: красные линии"
      uk: "Обмеження: червоні лінії"
      en: "Limits: red lines"
    question:
      ru: Какие у вас красные линии?
      uk: "Які у вас червоні лінії?"
      en: "What are your red lines?"
    description: >-
      Красные линии: то, на что человек не пойдёт ни при каких условиях, даже за деньги. Если
      красных линий нет или человек уже всё назвал — так и записывается.

# one step = one question = one answer: see the note at the top
answers: asked

completion: all_fields

confirm:
  question:
    ru: Это ваша ДНК бренда — так, как вы её рассказали. Всё верно, можно сохранять?
    uk: "Це ваша ДНК бренду — так, як ви її розповіли. Усе правильно, можна зберігати?"
    en: "This is your brand DNA — as you told it. Is everything correct, can it be saved?"

resume:
  mode: always

cancel:
  description: >-
    Клиент говорит, что ДНК бренда ему не нужна, не хочет отвечать на вопросы или просит
    прекратить.

actions:
  - on: completed
    do: http_post
    endpoint: results_api
  - on: silence
    after_minutes: 15
    do: http_post
    endpoint: results_api
    status: incomplete
  - on: cancelled
    do: http_post
    endpoint: results_api
