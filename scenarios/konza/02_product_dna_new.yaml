# Konza test tenant — Product DNA, the client has no product yet.
# Source: the «Мета-промптинг» section («ИИ пишет промпт для ИИ») of the workshop page
# factory/tmp/kovcheg/index.html. The owner's decision of 2026-10-08: that section is the
# product DNA. The 11-item list this file held before was built on a wrong mapping.
# Same seven fields and keys as product_dna (`product`, `geography`, `format`, `target` + the
# three researches «Рынок и тренды», «Целевая аудитория», «Конкуренты»), asked about an idea, not about a
# product on sale. The source lets a person start without a ready product: «Если не знаешь
# точно – опиши 2–3 варианта» — so two or three variants are an answer and the client is not
# made to pick one. A bare «хочу денег» is not: there is nothing to research yet.
# A guess is accepted when the client calls it a guess, and «не знаю» passes: that is what
# the research is run for.
# One thing and one filter per field, hints in «вы» — see 01_product_dna.yaml and
# 03_brand_dna.yaml.
# TODO(review): all wording (questions, filters, start signs) — check on live dialogues.
key: product_dna_new
title:
  ru: ДНК нового продукта
  uk: "ДНК нового продукту"
  en: "DNA of a new product"
language: ru
description: >-
  У клиента пока нет продукта. Собираем вводные для трёх глубоких исследований его идеи: что
  он мог бы продавать, где, в каком формате и кому, и что уже знает про рынок и тренды, про целевую аудиторию и про
  конкурентов. Чего он не знает — покажет исследование.

start:
  questions:
    - key: no_product_yet
      ask: >-
        Клиент говорит, что своего продукта или услуги у него пока нет, либо что он не знает,
        что ему продавать? Если клиент уже что-то продаёт и хочет в этом разобраться — ответ
        «нет».
      weight: 2
    - key: wants_product_dna
      ask: >-
        Клиент в этом сообщении прямо просит разобрать его продукт или услугу — собрать ДНК
        продукта? Если он просит только про бренд, ДНК бренда или «ДНК Бизнеса», либо просто
        рассказывает о себе и отвечает на вопрос бота — ответ «нет».
      weight: 1
  threshold: 2            # "no product yet" alone; together with "wants a DNA" it beats product_dna

incompatible_with: [product_dna]

fields:
  - key: product
    type: text
    title:
      ru: Продукт
      uk: "Продукт"
      en: "Product"
    question:
      ru: >-
        Мой бизнес: что вы хотите продавать? Опишите идею продукта своими словами. Если не
        знаете точно – опишите 2–3 варианта.
      uk: "Мій бізнес: що ви хочете продавати? Опишіть ідею продукту своїми словами. Якщо не знаєте точно – опишіть 2–3 варіанти."
      en: "My business: what do you want to sell? Describe the product idea in your own words. If you are not sure – describe 2–3 options."
    description: >-
      Под что делается исследование: идея продукта, два-три варианта или, если идеи ещё нет,
      экспертность клиента — чем он занимается и что умеет (например «12 лет работаю
      кинологом; думаю про онлайн-курс для владельцев щенков или про выезды на дом»).
      Выбирать один вариант не обязательно.
    filters:
      - key: research_subject
        ask: >-
          Из ответа понятно, под что делать исследование: названа идея продукта или хотя бы
          экспертность клиента — чем он занимается и что умеет?
        "yes": Да — названа идея продукта, два-три варианта или экспертность, из которой продукт можно искать.
        "no": Нет — только желание заработать («хочу денег», «что-нибудь онлайн») без того, что клиент умеет или хочет продавать.

  - key: geography
    type: text
    title:
      ru: География
      uk: "Географія"
      en: "Geography"
    question:
      ru: "География: страна/регион."
      uk: "Географія: країна/регіон."
      en: "Geography: country/region."
    description: >-
      Где клиент хочет это продавать: страна, регион или город (например «Украина»). Если
      ещё не решил — так и записывается.
    ask_after: [product]
    filters:
      - key: named_place
        ask: Клиент назвал страну, регион или город, где хочет продавать?
        "yes": Да — место названо. Также «да», если клиент прямо сказал, что ещё не решил.

  - key: format
    type: text
    title:
      ru: Формат
      uk: "Формат"
      en: "Format"
    question:
      ru: "Формат: онлайн/оффлайн."
      uk: "Формат: онлайн/офлайн."
      en: "Format: online/offline."
    description: >-
      В каком формате клиент хочет это продавать: онлайн, офлайн или и так и так (например
      «онлайн»). Если ещё не решил — так и записывается.
    ask_after: [product]
    filters:
      - key: online_or_offline
        ask: Клиент сказал, онлайн это будет, офлайн или и то и другое?
        "yes": Да — формат назван. Также «да», если клиент прямо сказал, что ещё не решил.

  - key: target
    type: text
    title:
      ru: "Целевая аудитория: кто"
      uk: "Цільова аудиторія: хто"
      en: "Target audience: who"
    question:
      ru: >-
        Целевая аудитория: кому вы хотите это продавать? Если не уверены – опишите, кого вы НЕ
        хотите видеть клиентом.
      uk: "Цільова аудиторія: кому ви хочете це продавати? Якщо не впевнені – опишіть, кого ви НЕ хочете бачити клієнтом."
      en: "Target audience: who do you want to sell this to? If you are not sure – describe who you do NOT want as a client."
    description: >-
      Кому клиент хочет это продавать: человек по конкретным признакам — возраст, пол,
      профессия, доход, ситуация (например «владельцы щенков, которые завели собаку
      впервые»). Если клиент не уверен — описание того, кого он не хочет видеть клиентом,
      тоже ответ. Ответом считается только то, что клиент сказал о тех, кому хочет
      продавать: попутное упоминание внутри описания идеи (например «курс для владельцев
      щенков») этот пункт не закрывает.
    ask_after: [product]
    filters:
      - key: concrete_audience
        ask: >-
          Клиент описал, кому именно он хочет продавать, конкретными признаками (возраст,
          пол, профессия, доход, ситуация, проблема), а не ответил «все» или «кому интересно»?
        "yes": Да — человек описан. Также «да», если клиент описал, кого он не хочет видеть своим клиентом.
        "no": Нет — «все», «кому интересно», «всем, у кого есть собака» — без признаков, по которым такого человека можно отличить.

  - key: market
    type: text
    title:
      ru: Рынок и тренды
      uk: "Ринок і тренди"
      en: "Market and trends"
    question:
      ru: >-
        Рынок и тренды: что вы уже знаете про рынок, на который хотите выйти, — объем, деньги,
        хайп или тренд, риски? Если не знаете — так и скажите, это покажет исследование.
      uk: "Ринок і тренди: що ви вже знаєте про ринок, на який хочете вийти, — обсяг, гроші, хайп чи тренд, ризики? Якщо не знаєте — так і скажіть, це покаже дослідження."
      en: "Market and trends: what do you already know about the market you want to enter — the size, the money, hype or trend, the risks? If you don't know — just say so, the research will show it."
    description: >-
      Что клиент сам знает о рынке, на который хочет выйти: объём, деньги, хайп это или
      тренд, риски (например «знаю три онлайн-курса для владельцев собак, стоят от 2000 до
      6000 гривен; сколько людей их покупает — не знаю»). Только то, что он знает сам. Ответ
      «не знаю» тоже считается ответом.
    ask_after: [product]
    filters:
      - key: fact_or_unknown
        ask: >-
          Клиент назвал хотя бы один конкретный факт о рынке — объём, деньги, тренд или риск,
          — а не только общие слова?
        "yes": Да — есть конкретный факт. Также «да», если клиент прямо сказал, что не знает.
        "no": Нет — только общие слова («рынок большой», «спрос есть», «всё растёт») без фактов.

  - key: audience
    type: text
    title:
      ru: "Целевая аудитория: боли и язык"
      uk: "Цільова аудиторія: болі та мова"
      en: "Target audience: pains and language"
    question:
      ru: >-
        Целевая аудитория: что вы уже знаете про боли, барьеры, драйверы, язык клиента? С
        какими вопросами к вам уже обращаются — какими словами? Если не знаете — так и скажите,
        это покажет исследование.
      uk: "Цільова аудиторія: що ви вже знаєте про болі, бар'єри, драйвери, мову клієнта? З якими питаннями до вас уже звертаються — якими словами? Якщо не знаєте — так і скажіть, це покаже дослідження."
      en: "Target audience: what do you already know about the client's pains, barriers, drivers and language? What questions do people already come to you with — in what words? If you don't know — just say so, the research will show it."
    description: >-
      Что клиент сам знает о тех, кому хочет продавать: их боли, барьеры (что мешает купить),
      драйверы (что подталкивает купить) и язык клиента — какими словами они сами говорят
      (например «знакомые пишут „грызёт всё дома, не знаю, что делать“; что мешает купить
      курс — не знаю»). Предположение тоже ответ, если клиент сам называет его
      предположением. «Не знаю» тоже считается ответом.
    ask_after: [target]
    filters:
      - key: heard_from_clients
        ask: >-
          Клиент привёл хотя бы одну боль, барьер или слова людей — простыми словами, как то,
          что он видел или слышал от реальных людей?
        "yes": Да — есть хотя бы одна боль, барьер или фраза простыми словами. Также «да», если клиент прямо сказал, что это его предположение, либо что он не знает.
        "no": Нет — только общие слова или термины («повышение эффективности», «им нужен результат»), либо догадка («может быть», «наверное», «возможно», «думаю») без того, откуда клиент это знает. Одни такие слова не значат «не знаю» — нужно, чтобы клиент сам сказал, что это предположение или что он не знает.

  - key: competitors
    type: text
    title:
      ru: Конкуренты
      uk: "Конкуренти"
      en: "Competitors"
    question:
      ru: >-
        Конкуренты: кто уже продаёт похожее, какие у них сильные/слабые стороны и чего у них
        нет? Если не знаете — так и скажите, это покажет исследование.
      uk: "Конкуренти: хто вже продає схоже, які в них сильні/слабкі сторони і чого в них немає? Якщо не знаєте — так і скажіть, це покаже дослідження."
      en: "Competitors: who already sells something similar, what are their strengths/weaknesses and what don't they have? If you don't know — just say so, the research will show it."
    description: >-
      Что клиент сам знает о тех, кто уже продаёт похожее: карта (кто они), их сильные и
      слабые стороны и GAP — чего у них нет, а людям нужно (например «есть два известных
      онлайн-курса: у них много отзывов, но нет разбора видео с собакой ученика»). Ответ «не
      знаю» тоже считается ответом.
    ask_after: [product]
    filters:
      - key: named_competitor
        ask: >-
          Клиент назвал хотя бы одного конкурента — по имени или по типу — либо сказал что-то
          конкретное о сильных или слабых сторонах тех, кто продаёт похожее?
        "yes": Да — конкурент назван или о конкурентах сказано что-то конкретное. Также «да», если клиент прямо сказал, что конкурентов не знает.
        "no": Нет — только общие слова («конкурентов много», «у всех одно и то же») без единого названного.

completion: all_fields

confirm:
  question:
    ru: Это ваша ДНК продукта — так, как вы её рассказали. Всё верно, можно сохранять?
    uk: "Це ваша ДНК продукту — так, як ви її розповіли. Усе правильно, можна зберігати?"
    en: "This is your product DNA — as you told it. Is everything correct, can it be saved?"

resume:
  mode: always

cancel:
  description: >-
    Клиент говорит, что искать продукт ему не нужно, не хочет отвечать на вопросы или просит
    прекратить. Также если клиент говорит, что продукт или услуга у него уже есть и он их
    продаёт.

actions:
  - on: completed
    do: http_post
    endpoint: results_api
  - on: silence
    after_minutes: 15
    do: http_post
    endpoint: results_api
    status: incomplete
  - on: cancelled
    do: http_post
    endpoint: results_api
