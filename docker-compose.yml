name: zama_chat

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zama
      POSTGRES_PASSWORD: zama
      POSTGRES_DB: zama
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zama -d zama"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
