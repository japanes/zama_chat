name: zama_chat

# Dev: `docker compose up -d` (make up) starts everything — the database, the search, the
# API, the jobs worker and the admin (http://localhost:3120). The code is mounted from
# this folder: the API, the worker and the admin pick up a change by themselves.
# A server runs docker-compose.prod.yml instead.

x-backend: &backend
  image: zama_chat-backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    # inside Docker the neighbours are called by their service names, not localhost
    DATABASE_URL: postgresql+asyncpg://zama:zama@postgres:5432/zama
    ELASTICSEARCH_URL: http://elasticsearch:9200
    QDRANT_URL: http://qdrant:6333
  volumes:
    - ./backend:/app/backend
    - ./scenarios:/app/scenarios:ro
    - ./docs/legacy-prompts:/app/docs/legacy-prompts:ro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zama
      POSTGRES_PASSWORD: zama
      POSTGRES_DB: zama
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zama -d zama"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Dev only — no security, ports on localhost.
  elasticsearch:
    build:
      context: ./docker/elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # dev only: with less than 5% of the disk free ES makes every index read-only and
      # a new index waits for its shard forever
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  qdrant:
    # TODO(review): version (the code uses POST /points/query — Qdrant 1.10+)
    image: qdrant/qdrant:v1.13.6
    ports:
      - "127.0.0.1:6334:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  # runs once on every start and exits; the API and the worker wait for it
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8090", "--reload", "--reload-dir", "app"]
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
      start_interval: 2s

  worker:
    <<: *backend
    # restarts on a change of the code, as the API does
    command: ["watchfiles", "--filter", "python", "zama worker", "app"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin:
    build:
      context: ./admin
      target: build
    environment:
      NUXT_BACKEND_URL: http://api:8090
    ports:
      - "127.0.0.1:3120:3120"
    volumes:
      - ./admin:/app
      # the container's own packages and build files, not this machine's. They outlive a
      # rebuild: after a change of package.json — `docker compose up -d --build -V admin`
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3120/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 3s

volumes:
  pgdata:
  esdata:
  qdrantdata:
