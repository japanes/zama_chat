[project]
name = "zama-chat"
version = "0.1.0"
description = "Universal chat bot: dialog engine with scenarios, Jev decisions and own admin"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.1",
    "cryptography>=43",
    "openai>=1.50",
    "uuid-utils>=0.9",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
zama = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "db: needs a real PostgreSQL (TEST_DATABASE_URL)",
    "live: calls real external services (Gateway, Jev); skipped by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # cyrillic/ukrainian letters in strings and comments are fine
    "B008",                         # FastAPI Depends() in defaults
    "ASYNC109",                     # `timeout` params are passed on to HTTP clients
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
